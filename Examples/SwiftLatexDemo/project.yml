# xcodegen manifest — `xcodegen generate`로 SwiftLatexDemo.xcodeproj 생성 (DEVELOPMENT.md §7 P0).
name: SwiftLatexDemo
options:
  bundleIdPrefix: dev.swiftlatex
  deploymentTarget:
    iOS: "16.0"
packages:
  SwiftLatex:
    path: ../..
targets:
  SwiftLatexDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SwiftLatex
        product: SwiftLatex
      - package: SwiftLatex
        product: SwiftLatexBlockEditor
      # 코드 블록 확장은 opt-in product다. 데모는 둘 다 연결해 켜고 끄며 비교한다.
      - package: SwiftLatex
        product: SwiftLatexHighlight
      - package: SwiftLatex
        product: SwiftLatexMermaid
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.7.0"
        CODE_SIGN_STYLE: Automatic
  SwiftLatexDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SwiftLatexDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  SwiftLatexDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SwiftLatexDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  SwiftLatexDemo:
    build:
      targets:
        SwiftLatexDemo: all
    test:
      testPlans:
        - path: SwiftLatexDemo.xctestplan
          defaultPlan: true
