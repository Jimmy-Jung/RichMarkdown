<!doctype html>

<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-owS6vspznh+XfsKdMf/uPhpgCs0AR1cHc7Qqzp3EtJI='; style-src 'self' 'unsafe-inline'; img-src data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; font-family: -apple-system, sans-serif; }
    #diagram { box-sizing: border-box; padding: 16px; }
    /* 확대하지 않는 정책(useMaxWidth: false) 때문에 좁은 다이어그램은 컨테이너보다 작다.
       margin-inline: auto가 없으면 남는 폭이 전부 오른쪽으로 몰려 좌측에 붙는다. */
    #diagram svg { display: block; margin-inline: auto; height: auto; max-width: none; }
  </style>
  <script src="mermaid.bundle.js"></script>
</head>
<body>
  <div id="diagram" role="img" aria-label="Mermaid 다이어그램"></div>
  <script>
    // SVG ID와 게시 세대는 목적이 다르다. 취소도 게시 세대를 무효화한다.
    let serial = 0;
    let generation = 0;
    let nativeRequest = null;
    let queue = Promise.resolve();

    window.cancelDiagram = request => {
      if (nativeRequest === request) generation++;
    };

    // Mermaid initialize는 전역 설정을 바꾸므로 같은 페이지의 엔진 작업은 직렬 실행한다.
    window.renderDiagram = (source, dark, width, fontSize, request = null) => {
      const token = ++generation;
      nativeRequest = request;
      const checkCurrent = () => {
        if (token !== generation) throw new Error('이전 Mermaid 요청이 취소되었습니다.');
      };
      const work = async () => {
        checkCurrent();
        if (source.length > 20000) throw new Error('20,000자 이하의 Mermaid 원문만 표시합니다.');
        if (!Number.isFinite(width) || !Number.isFinite(fontSize) || fontSize <= 0) {
          throw new Error('다이어그램 크기가 올바르지 않습니다.');
        }
        await document.fonts.ready;
        checkCurrent();
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          secure: [...mermaid.mermaidAPI.defaultConfig.secure, 'htmlLabels', 'dompurifyConfig'],
          htmlLabels: false,
          theme: dark ? 'dark' : 'default',
          fontFamily: '-apple-system, sans-serif',
          fontSize: fontSize,
          maxTextSize: 20000,
          maxEdges: 200,
          flowchart: { htmlLabels: false, useMaxWidth: false },
          suppressErrorRendering: true
        });
        const result = await mermaid.render('richmarkdown-mermaid-' + (++serial), source);
        checkCurrent();
        // 표시 DOM에 넣기 전에 숨긴 staging에서 측정과 frame 대기를 끝낸다.
        const staging = document.createElement('div');
        staging.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
        staging.innerHTML = result.svg;
        document.body.appendChild(staging);
        try {
          const svg = staging.querySelector('svg');
          if (!svg) throw new Error('SVG가 생성되지 않았습니다.');
          const box = svg.viewBox.baseVal;
          const rect = svg.getBoundingClientRect();
          const naturalWidth = box.width || rect.width;
          const naturalHeight = box.height || rect.height;
          if (!(naturalWidth > 0 && naturalHeight > 0)) throw new Error('다이어그램 크기가 올바르지 않습니다.');
          const targetWidth = Math.max(60, Math.min(width - 32, naturalWidth));
          const height = naturalHeight * targetWidth / naturalWidth;
          if (!Number.isFinite(height) || height > 4000) throw new Error('표시 한도(높이 4,000pt)를 넘었습니다.');
          svg.style.width = targetWidth + 'px';
          svg.style.height = height + 'px';
          svg.setAttribute('width', targetWidth);
          svg.setAttribute('height', height);
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
          checkCurrent();
          const element = document.getElementById('diagram');
          element.replaceChildren(svg);
          element.style.width = width + 'px';
          return { width: width, height: height + 32 };
        } finally {
          staging.remove();
        }
      };
      const result = queue.then(work);
      queue = result.catch(() => {});
      return result;
    };
  </script>
</body>
</html>
